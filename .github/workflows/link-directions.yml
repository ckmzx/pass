name: Link directions card
on:
  push:
    paths:
      - '.github/workflows/link-directions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Link directions card by its class
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          pattern = r'(<a\b(?=[^>]*\bquick-link--04\b)[^>]*\bhref=")[^"]*(")'
          url = 'https://naver.me/5ZJnyauB'
          html, n = re.subn(pattern, lambda m: m.group(1) + url + m.group(2), html, count=1)
          if n != 1:
              raise SystemExit('Directions quick card not found; no changes saved')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: link directions quick card to Naver'
          git push origin HEAD:main
