name: Restore quick card corner arrows
on:
  push:
    paths:
      - '.github/workflows/quick-link-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-arrows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show arrow on each quick card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '.quick-grid .quick-link::after{content:none}'
          new = '.quick-grid .quick-link::after{content:"↗"}'
          if html.count(old) != 1:
              raise SystemExit('Expected arrow suppression rule not found exactly once')
          p.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit arrow restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore arrow on each quick card'
            git push origin HEAD:main
          fi
