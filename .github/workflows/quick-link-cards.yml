name: Rename quick cards and add icons
on:
  push:
    paths:
      - '.github/workflows/quick-link-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-quick-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace numbers and old copy with named icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          cards = [
              ('01','맞춤 진단','현재 위치를 정확히','#about','인사말','<path d="M20 11a8 8 0 0 1-8 8H7l-4 2v-6a8 8 0 1 1 17-4Z"/><path d="M8 10h8M8 13h5"/>'),
              ('02','기록 향상','종목별 퍼포먼스 설계','#program','업무협약 업체','<path d="M10 13a5 5 0 0 1 0-7l1-1a5 5 0 0 1 7 7l-1 1"/><path d="M14 11a5 5 0 0 1 0 7l-1 1a5 5 0 0 1-7-7l1-1"/>'),
              ('03','입시 전략','대학·전형별 지원 분석','#process','명예의 전당','<path d="M7 3h10v6a5 5 0 0 1-10 0V3Z"/><path d="M7 5H4v3a4 4 0 0 0 4 4M17 5h3v3a4 4 0 0 1-4 4M12 14v5M8 21h8"/>'),
              ('04','끝까지 관리','실기와 학업의 균형','#result','오시는 길','<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>')
          ]
          if html.count('</style>') != 1:
              raise SystemExit('Stylesheet insertion point not found')
          for n, old_name, old_sub, href, name, drawing in cards:
              old = f'<a class="quick-item quick-link quick-link--{n}" href="{href}" aria-label="{old_name} 자세히 보기"><span class="quick-num">{n}</span><div><div class="quick-name">{old_name}</div><div class="quick-sub">{old_sub}</div></div></a>'
              icon = f'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{drawing}</svg>'
              new = f'<a class="quick-item quick-link quick-link--{n}" href="{href}" aria-label="{name} 보기"><span class="quick-icon" aria-hidden="true">{icon}</span><span class="quick-name">{name}</span></a>'
              if html.count(old) != 1:
                  raise SystemExit('Expected quick card not found exactly once: ' + n)
              html = html.replace(old, new, 1)
          css = '.quick-grid .quick-link{align-items:center;justify-content:flex-start;min-height:136px}.quick-grid .quick-link .quick-icon{flex:0 0 46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25)}.quick-grid .quick-link .quick-icon svg{display:block;width:27px;height:27px}.quick-grid .quick-link .quick-name{font-size:18px;line-height:1.3}.quick-grid .quick-link::after{content:none}@media(max-width:780px){.quick-grid .quick-link{min-height:118px;gap:9px}.quick-grid .quick-link .quick-icon{flex-basis:35px;height:35px;border-radius:10px}.quick-grid .quick-link .quick-icon svg{width:21px;height:21px}.quick-grid .quick-link .quick-name{font-size:14px}}'
          html = html.replace('</style>', css + '</style>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit named cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: rename quick links and add matching icons'
            git push origin HEAD:main
          fi
