name: Refine data carousel controls
on:
  push:
    paths:
      - '.github/workflows/data-image-carousel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Place opaque arrows beside carousel image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if html.count('class="result-carousel-controls"') != 1 or html.count('</style>') != 1 or 'result-carousel-controls button:hover' in html:
              raise SystemExit('Expected data carousel not found or style already applied')
          css = '#result .result-carousel{border-radius:18px;border:1px solid #e4e9f4;background:linear-gradient(145deg,#fff,#f7f9ff);box-shadow:0 16px 42px rgba(17,44,94,.12)}#result .result-carousel-track{inset:0}#result .result-slide img{padding:18px 64px 42px}#result .result-carousel-controls{inset:0;height:auto;align-items:center;justify-content:space-between;padding:0 14px;background:transparent;border:0;pointer-events:none}#result .result-carousel-controls button{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#173b8d;color:#fff;font-size:23px;line-height:1;box-shadow:0 8px 20px rgba(23,59,141,.28);pointer-events:auto;transition:background .2s ease,transform .2s ease}#result .result-carousel-controls button:hover{background:#3156b7;transform:scale(1.08)}#result .result-carousel-count{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:#fff;box-shadow:0 3px 12px rgba(17,44,94,.12);pointer-events:none}@media(max-width:780px){#result .result-slide img{padding:12px 50px 40px}#result .result-carousel-controls{padding:0 8px}#result .result-carousel-controls button{width:38px;height:38px;font-size:20px}}@media(prefers-reduced-motion:reduce){#result .result-carousel-controls button{transition:none}}'
          html = html.replace('</style>', css + '</style>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit refined controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'style: place opaque carousel arrows beside photos'
            git push origin HEAD:main
          fi
