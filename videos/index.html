<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>실기 영상 확인 | PASS</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#142b49;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:white;border-radius:22px;padding:32px;box-shadow:0 18px 50px #12294916}.brand{font-weight:900;letter-spacing:.09em;color:#143d78;font-size:22px}h1{font-size:27px;margin:25px 0 12px}p{line-height:1.7;color:#52657b}.field{display:block;font-weight:700;margin:27px 0 8px}input{width:100%;padding:15px;border:1px solid #2463aa}button{width:100%;background:#163d75;color:#fff;border:0;border-radius:10px;padding:15px;margin-top:14px;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#092b59}.notice{font-size:13px;background:#edf3fa;padding:14px;border-radius:10px;margin-top:24px}.error{min-height:1.6em;color:#a52332;font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<main class="card">
<div class="brand">PASS</div>
<h1>나의 실기 영상</h1>
<p>학원에서 안내받은 학생코드를 입력하세요. 해당 학생의 영상 폴더로 이동한 뒤, 폴더 비밀번호를 입력하면 영상을 확인할 수 있습니다.</p>
<form id="portal">
<label class="field" for="studentCode">학생코드</label>
<input id="studentCode" name="studentCode" autocomplete="off" spellcheck="false" required placeholder="예: P001" maxlength="32">
<button type="submit">내 폴더로 이동</button>
<p class="error" id="error" role="alert" aria-live="polite"></p>
</form>
<p class="notice">학생코드는 보안 비밀번호가 아닙니다. 비밀번호는 이동한 폴더에서 입력하며, 이 페이지나 GitHub에 저장하지 않습니다. 학생코드와 폴더 비밀번호를 다른 사람에게 알려주지 마세요.</p>
</main>
<script>
// 공개 코드에 학생 실명이나 폴더 비밀번호를 추가하지 마세요.
const studentFolders = [
  {code:'조경민',url:'https://o365skku-my.sharepoint.com/:f:/g/personal/ckmn_o365_skku_edu/IgCIueNVemxrQrnhJJZe93PVAc93D3XcbJUa60B6hrbpca0?e=iJv8uA'}
];
const links = new Map(studentFolders.map(({code,url}) => [code.trim().toUpperCase(),url]));
document.getElementById('portal').addEventListener('submit',event=>{
  event.preventDefault();
  const code=document.getElementById('studentCode').value.trim().toUpperCase();
  const url=links.get(code);
  const error=document.getElementById('error');
  if(!url){error.textContent=studentFolders.length?'등록되지 않은 코드입니다. 학원에 문의해 주세요.':'영상 폴더 연결 준비 중입니다. 학원에 문의해 주세요.';return;}
  try{const target=new URL(url);if(target.protocol!=='https:')throw Error('invalid');window.location.assign(target.href);}catch{error.textContent='폴더 링크 설정을 확인해 주세요.';}
});
</script>
</body>
</html>
